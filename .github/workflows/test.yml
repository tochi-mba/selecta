name: test

on:
  push:
    branches: [main, build/v1]
  pull_request:

# A new commit makes older results obsolete. Never cancel main's push checks for a PR run.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python / lint, tests and coverage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: No file over 1,000 lines
        run: uv run pytest tests/test_file_length.py -q
      - run: uv run pytest --cov=selecta --cov-report=term-missing --cov-fail-under=70

  web:
    name: Web / unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  browser:
    # Each Windows runner has its own server, database and port 8799. Playwright retains
    # workers=1 inside a shard because its tests mutate one fixture library.
    # Two independent shards parallelize the slow real-Edge suite without skipping tests.
    name: Edge E2E (shard ${{ matrix.shard }}/2)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Browser tests, in Edge, muted
        run: pnpm e2e --shard=${{ matrix.shard }}/2
        working-directory: web
      - name: Keep what the browser tests saw when one fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore

  verify:
    # Preserve one unambiguous gate for branches and reviewers: any failed, cancelled
    # or skipped prerequisite is a failed PR. Both shards must finish successfully.
    name: verify
    if: ${{ always() }}
    needs: [python, web, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Python: $PYTHON_RESULT; Web: $WEB_RESULT; Edge E2E: $BROWSER_RESULT"
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$BROWSER_RESULT" = success
