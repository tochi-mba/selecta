name: test

on:
  push:
    branches: [main, build/v1]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: No file over 1,000 lines
        run: uv run pytest tests/test_file_length.py -q
      - run: uv run pytest --cov=selecta --cov-report=term-missing --cov-fail-under=70
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Browser tests, in Edge, muted
        run: pnpm e2e
        working-directory: web
      - name: Keep what the browser tests saw when one fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results
          if-no-files-found: ignore
