name: test

on:
  push:
    branches: [main, build/v1]
  pull_request:
  workflow_dispatch:

# While the repository is public, Actions minutes are free, so a run that has started always
# finishes and every push gets a verdict. Once it's private, minutes are billed (Windows at
# twice the Linux rate), so a newer push to a pull request cancels the run it supersedes. Runs
# on main and manual runs are never cancelled. Either way GitHub keeps at most one waiting run
# per group, so a burst of pushes costs one extra run, which tests the newest commit.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflows:
    # The workflow files themselves: syntax, expressions, runner labels, action inputs, and
    # shellcheck over every run script.
    name: Workflows / actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint every workflow
        # The release binary, checked against its published SHA-256, rather than a download
        # script fetched from a tag and piped into bash.
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint -color

  changes:
    # Decides whether a pull request touches anything the Windows browser suites depend on.
    # Docs-only means every changed file is under docs/ or is Markdown, and none of them is a
    # file (or inside a folder) that a browser spec reads: the paths are found by searching
    # web/e2e and web/e2e-cloud for docs/ paths, including ones built with join('docs', ...).
    # Pushes and manual runs always run everything. Python and web unit tests read docs too,
    # so they are never skipped; verify accepts `skipped` only for the gated jobs and only when
    # this job said docs-only.
    name: Changes / docs-only check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit; its first parent is the base tip.
          fetch-depth: 2
      - id: classify
        name: Classify the changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Not a pull request: run everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          specs=$(find web/e2e web/e2e-cloud -type f \
            \( -name '*.ts' -o -name '*.tsx' -o -name '*.mjs' -o -name '*.js' -o -name '*.json' \))
          # Every docs/ path a spec names, as written and with join('a', 'b') read as a/b.
          # shellcheck disable=SC2086
          refs=$( { cat $specs; cat $specs | sed -E "s/['\"\`] *, *['\"\`]/\//g"; } \
            | grep -oE 'docs/[A-Za-z0-9_./-]*' | sed -E 's#[./]+$##' | sort -u || true)
          code=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              docs/* | *.md) ;;
              *) echo "Code change: $path"; code=true; break ;;
            esac
            while IFS= read -r ref; do
              if [ -n "$ref" ] && { [ "$path" = "$ref" ] || [ "${path#"$ref"/}" != "$path" ]; }; then
                echo "Read by a browser spec ($ref): $path"; code=true; break 2
              fi
            done <<< "$refs"
            # shellcheck disable=SC2086
            if [ "${path#docs/}" = "$path" ] && grep -qF "$(basename "$path")" $specs; then
              echo "Named by a browser spec: $path"; code=true; break
            fi
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  service-image:
    # The image deploy.yml builds on main, built here without pushing, so a broken Dockerfile
    # fails the pull request instead of the first deploy after merge.
    name: Service image / docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the service image (no push)
        run: docker build -f infra/docker/service.Dockerfile -t selecta-service:ci .

  lint:
    # Fast and on Linux, so a style slip or an oversized file fails in a minute and the Windows
    # jobs (billed at twice the Linux rate on a private repository) never start.
    name: Lint / ruff, file length, committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: No file over 1,000 lines, and no live secret committed
        run: uv run pytest tests/test_file_length.py tests/test_no_committed_secrets.py -q

  checklist-evidence:
    name: Checklist / evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository's Python, not whatever the runner image ships; the script needs no packages.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
      - name: Reject checked tasks without evidence
        run: uv run --no-project python src/selecta/audit/checklist_evidence.py

  python:
    # Every pytest case is assigned to exactly one isolated Windows runner.
    name: Python / tests (shard ${{ matrix.shard }}/2)
    needs: [lint]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Suite-inventory tests compare against a historical baseline commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - name: Install FFmpeg
        # A download from a third-party mirror, so retried; tests themselves never are here.
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "::warning::FFmpeg install failed (attempt $attempt of 3)"
            Start-Sleep -Seconds 20
          }
          exit 1
      - run: uv sync --locked
      - name: Run full assigned pytest shard with coverage
        env:
          SELECTA_TEST_SHARD: ${{ matrix.shard }}/2
        run: uv run pytest --cov=selecta --cov-report=term-missing --cov-fail-under=0
      - name: Rename per-runner coverage
        run: Rename-Item .coverage ".coverage.${{ matrix.shard }}"
      - name: Upload coverage for aggregate verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  cloud:
    # Cloud code on Linux against a real PostgreSQL: row locks, SKIP LOCKED, LISTEN/NOTIFY,
    # advisory locks and row-level security only exist there. The Windows shards run the same
    # tests on SQLite. See docs/saas/18-test-plan.md. Three shards, each under half its limit;
    # verify combines their coverage and runs the gate.
    name: Cloud / PostgreSQL (shard ${{ matrix.shard }}/3)
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selecta
          POSTGRES_PASSWORD: selecta
          POSTGRES_DB: selecta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selecta -d selecta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      SELECTA_TEST_POSTGRES_URL: postgresql+psycopg://selecta:selecta@localhost:5432/selecta_test
      # SeaweedFS, an S3 server, for the object-storage adapter's integration tests
      # (tests/test_cloud_storage_s3.py). Throwaway credentials for a throwaway container.
      SELECTA_TEST_S3_ENDPOINT: http://localhost:8333
      SELECTA_TEST_S3_ACCESS_KEY: selecta-s3
      SELECTA_TEST_S3_SECRET_KEY: selecta-s3-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - name: Start the S3 server (SeaweedFS)
        # MinIO stopped publishing images, so SeaweedFS stands in: master, volume, filer and S3
        # gateway in one container. The AWS_* variables make an admin identity and switch on
        # SigV4 checking; the region is taken from each request's scope, so R2's `auto` works.
        # Ready once the gateway answers and the master can hand out a file id (a volume server
        # has registered), so the first upload doesn't race the cluster forming.
        run: |
          docker run -d --name seaweedfs -p 8333:8333 -p 9333:9333 \
            -e AWS_ACCESS_KEY_ID="$SELECTA_TEST_S3_ACCESS_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$SELECTA_TEST_S3_SECRET_KEY" \
            chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 \
            server -s3 -volume.max=100
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8333/healthz > /dev/null \
              && curl -fsS http://localhost:9333/dir/assign | grep -q '"fid"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs seaweedfs
          exit 1
      - name: Cloud tests on SQLite and PostgreSQL, with branch coverage
        env:
          SELECTA_TEST_SHARD: ${{ matrix.shard }}/3
          COVERAGE_FILE: .coverage.cloud-${{ matrix.shard }}
        run: >-
          uv run pytest
          tests/test_cloud_*.py tests/test_worker_gateway_api.py tests/test_room_to_play.py
          tests/test_operation_identity.py tests/test_flags.py tests/test_flag_server.py
          -q --durations=15 --cov=selecta --cov-branch --cov-report= --cov-fail-under=0
      - name: Upload this shard's coverage for verify
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-coverage-${{ matrix.shard }}
          path: .coverage.cloud-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  web:
    name: Web / unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Build again with the component gallery the ADR-279 and S3-0051 specs measure
        run: pnpm exec vite build --outDir dist-gallery --emptyOutDir
        working-directory: web
        env:
          VITE_SELECTA_GALLERY: "1"
      # Built once here and served by the Windows browser jobs, which skip their own builds.
      - name: Share the production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Share the gallery build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-gallery
          path: web/dist-gallery
          if-no-files-found: error
          retention-days: 1

  browser:
    # One worker per isolated Windows server; two shards split all real Edge tests.
    name: Edge E2E (shard ${{ matrix.shard }}/2)
    needs: [changes, lint, web]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - name: Install FFmpeg
        # A download from a third-party mirror, so retried; tests themselves never are here.
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "::warning::FFmpeg install failed (attempt $attempt of 3)"
            Start-Sleep -Seconds 20
          }
          exit 1
      - run: uv sync --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Fetch the web job's build, with the component gallery the ADR-279 and S3-0051 specs measure
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-gallery
          path: web/dist
      - name: Browser tests, in Edge, muted
        run: pnpm e2e --shard=${{ matrix.shard }}/2
        working-directory: web
      - name: Keep failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload synthetic visual-review candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selecta-3-1-visual-review-${{ matrix.shard }}
          path: web/test-results/**/candidate-*.png
          if-no-files-found: ignore
          retention-days: 7

  flags:
    # Every feature turned off in turn, on every page it shows up on: layout, accessibility, links,
    # wording and server calls. Screenshots are review candidates, uploaded every time.
    name: Feature-flag sweep (shard ${{ matrix.shard }}/2)
    needs: [changes, lint, web]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - name: Install FFmpeg
        # A download from a third-party mirror, so retried; tests themselves never are here.
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "::warning::FFmpeg install failed (attempt $attempt of 3)"
            Start-Sleep -Seconds 20
          }
          exit 1
      - run: uv sync --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Fetch the web job's production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Every feature off, in Edge, muted
        run: pnpm e2e:flags --shard=${{ matrix.shard }}/2
        working-directory: web
      - name: Upload what the pages look like with features off
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flags-sweep-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  cloud-browser:
    # Every cloud browser test in Edge against the one cloud test server (tests/e2e_cloud_server.py):
    # meters, over quota, checkout consent, upload resume, signed URL refresh, prefetch, export,
    # the event-stream fallback, the cloud origin allowlist, Rooms, guests, displays and devices.
    name: Cloud E2E (Linux)
    needs: [changes, lint, web]
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Pinned: Playwright's `install --with-deps` only knows the system packages of the Ubuntu
    # releases it lists, and ubuntu-latest moved to 26.04. Move to ubuntu-latest once the
    # Playwright in web/package.json supports it (and update the browser cache key below).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: selecta
          POSTGRES_PASSWORD: selecta
          POSTGRES_DB: selecta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selecta -d selecta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      SELECTA_TEST_POSTGRES_URL: postgresql+psycopg://selecta:selecta@localhost:5432/selecta_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Firefox and WebKit download into ~/.cache/ms-playwright; the lockfile pins Playwright, so
      # it pins those builds too. Chrome and Edge are system installs and aren't cached.
      - name: Cache Playwright's browser downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install cloud and alignment browsers for Playwright
        # Downloads and apt mirrors fail now and then, so the install is retried; tests are not.
        run: |
          for attempt in 1 2 3; do
            if pnpm exec playwright install --with-deps chrome msedge firefox webkit; then
              exit 0
            fi
            echo "::warning::Playwright browser install failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
        working-directory: web
      - name: Cloud browser tests, in Edge, muted
        run: pnpm e2e:cloud
        working-directory: web
      - name: Playback proxy sample alignment in Chrome, Edge, Firefox and WebKit
        run: pnpm e2e:alignment
        working-directory: web
      - name: Keep failed cloud browser artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-browser-test-results
          path: web/test-results/cloud
          if-no-files-found: ignore
          retention-days: 7

  verify:
    # A canceled, missing or failing shard cannot yield a green verification.
    # Combined Python coverage, not a partial shard, must meet the original 70%.
    name: verify
    if: ${{ always() }}
    needs:
      - workflows
      - changes
      - service-image
      - lint
      - checklist-evidence
      - python
      - cloud
      - web
      - browser
      - flags
      - cloud-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require all prerequisite jobs to pass
        # Every job must succeed. The one exception: the three browser jobs may be skipped, but
        # only when the changes job itself succeeded and said the pull request is docs-only.
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          SERVICE_IMAGE_RESULT: ${{ needs.service-image.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          EVIDENCE_RESULT: ${{ needs.checklist-evidence.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          FLAGS_RESULT: ${{ needs.flags.result }}
          CLOUD_RESULT: ${{ needs.cloud.result }}
          CLOUD_BROWSER_RESULT: ${{ needs.cloud-browser.result }}
        run: |
          echo "Changes: $CHANGES_RESULT (code=$CODE_CHANGED); Service image: $SERVICE_IMAGE_RESULT"
          echo "Workflows: $WORKFLOWS_RESULT; Lint: $LINT_RESULT; Evidence: $EVIDENCE_RESULT; Python: $PYTHON_RESULT; Web: $WEB_RESULT; Edge E2E: $BROWSER_RESULT; Flags: $FLAGS_RESULT; Cloud: $CLOUD_RESULT; Cloud E2E: $CLOUD_BROWSER_RESULT"
          test "$CHANGES_RESULT" = success
          case "$CODE_CHANGED" in
            true | false) ;;
            *) echo "The changes job gave no verdict"; exit 1 ;;
          esac
          test "$SERVICE_IMAGE_RESULT" = success
          test "$WORKFLOWS_RESULT" = success
          test "$LINT_RESULT" = success
          test "$EVIDENCE_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$CLOUD_RESULT" = success
          for gated in "$BROWSER_RESULT" "$FLAGS_RESULT" "$CLOUD_BROWSER_RESULT"; do
            if [ "$CODE_CHANGED" = false ] && [ "$gated" = skipped ]; then
              continue
            fi
            test "$gated" = success
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15" # matches infra/docker/service.Dockerfile
          enable-cache: true
      - name: Download every Python coverage result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-coverage-*
          path: .
          merge-multiple: true
      - name: Combine measured coverage and enforce 70 percent minimum
        run: |
          uvx --from coverage==7.17.2 coverage combine
          uvx --from coverage==7.17.2 coverage report --fail-under=70
      - name: Download every cloud shard's coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cloud-coverage-*
          path: cloud-coverage
          merge-multiple: true
      - name: Combine cloud coverage and run the gate (report only until the module tests land)
        run: |
          uvx --from coverage==7.17.2 coverage combine --data-file=cloud-coverage/.coverage cloud-coverage
          uvx --from coverage==7.17.2 coverage json --data-file=cloud-coverage/.coverage -o cloud-coverage.json
          uv run --no-project python tests/coverage_gate.py cloud-coverage.json
      - name: Keep the cloud coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-coverage
          path: cloud-coverage.json
          if-no-files-found: warn
          retention-days: 14
