name: test

on:
  push:
    branches: [main, build/v1]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # Every pytest case is assigned to exactly one isolated Windows runner.
    name: Python / tests (shard ${{ matrix.shard }}/2)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --locked
      - run: uv run ruff check .
      - name: No file over 1,000 lines
        run: uv run pytest tests/test_file_length.py -q
      - name: Run full assigned pytest shard with coverage
        env:
          SELECTA_TEST_SHARD: ${{ matrix.shard }}/2
        run: uv run pytest --cov=selecta --cov-report=term-missing --cov-fail-under=0
      - name: Rename per-runner coverage
        run: Rename-Item .coverage ".coverage.${{ matrix.shard }}"
      - name: Upload coverage for aggregate verification
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  web:
    name: Web / unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  browser:
    # One worker per isolated Windows server; two shards split all real Edge tests.
    name: Edge E2E (shard ${{ matrix.shard }}/2)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - name: Browser tests, in Edge, muted
        run: pnpm e2e --shard=${{ matrix.shard }}/2
        working-directory: web
      - name: Keep failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: web/test-results
          if-no-files-found: ignore

  verify:
    # A canceled, missing or failing shard cannot yield a green verification.
    # Combined Python coverage, not a partial shard, must meet the original 70%.
    name: verify
    if: ${{ always() }}
    needs: [python, web, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all prerequisite jobs to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          WEB_RESULT: ${{ needs.web.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          echo "Python: $PYTHON_RESULT; Web: $WEB_RESULT; Edge E2E: $BROWSER_RESULT"
          test "$PYTHON_RESULT" = success
          test "$WEB_RESULT" = success
          test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Download every Python coverage result
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-*
          path: .
          merge-multiple: true
      - name: Combine measured coverage and enforce 70 percent minimum
        run: |
          uvx --from coverage==7.17.2 coverage combine
          uvx --from coverage==7.17.2 coverage report --fail-under=70
