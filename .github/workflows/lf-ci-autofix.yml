name: LF temporary format repair
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lf-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/local-first-cloud-rearchitecture-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/local-first-cloud-rearchitecture-20261113
          persist-credentials: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          version: "0.12.15"
      - run: uv sync --locked
      - name: Apply Ruff's safe fixes and format new LF Python code
        shell: bash
        run: |
          uv run ruff check --fix . || true
          uv run ruff format src/selecta/lf_* tests/test_lf*.py tests/lf_harness tools/lf_harness src/selecta/rooms/store.py
          git diff --check
      - name: Commit formatting fixes only to LF ADR head
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style(lf): fix combined agent Ruff lint and formatting"
          git push origin HEAD:refs/heads/docs/local-first-cloud-rearchitecture-20261113
