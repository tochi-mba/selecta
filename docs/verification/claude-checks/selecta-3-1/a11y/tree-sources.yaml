  - heading "Add another folder" [level=3]
  - paragraph: Copy a folder address from File Explorer. Your audio stays on this PC. For lyric lookup, Selecta sends each song’s artist, title, album and duration to LRCLIB. That request does not upload the audio file. Selecta also communicates with its local server.
  - paragraph:
    - text: "Example folder paths: Windows"
    - code: C:\\Users\\you\\Music
    - text: ; macOS
    - code: /Users/you/Music
    - text: ; Linux
    - code: /home/you/Music
    - text: . Use a path on the computer running Selecta, not a website address.
