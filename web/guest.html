<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Request a song</title>
    <meta name="theme-color" content="#100f0c" />
    <!-- One preview for every room link: an invitation, never the room's name, host or songs -->
    <meta name="description" content="You're invited: join the room on SelectaDJ and request a song." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SelectaDJ" />
    <meta property="og:title" content="Request a song" />
    <meta property="og:description" content="You're invited: join the room on SelectaDJ and add to the mix." />
    <meta property="og:image" content="https://app.selectadj.app/brand/png/room-card-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="You're invited: request a song on SelectaDJ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.selectadj.app/brand/png/room-card-1200x630.png" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f2e9" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8ff3a'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23100f0c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- The outline of the room while it loads; main.ts replaces it. -->
    <main id="guest">
      <p class="g-sr" role="status">Loading the room...</p>
      <div class="g-skel" aria-hidden="true">
        <i class="g-skel-line"></i>
        <i class="g-skel-title"></i>
        <div class="g-section"><i class="g-skel-art"></i><span><i class="g-skel-line"></i><i class="g-skel-title"></i></span></div>
        <div class="g-section"><span><i class="g-skel-line"></i><i class="g-skel-title"></i></span></div>
      </div>
    </main>
    <noscript><p style="max-width:32rem;margin:15vh auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">Requesting a song needs JavaScript. Turn it on for this site to join the room.</p></noscript>
    <script type="module" src="/src/guest/main.ts"></script>
  </body>
</html>
