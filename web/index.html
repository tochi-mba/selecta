<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SelectaDJ</title>
    <meta name="description" content="SelectaDJ makes and plays mixes from your own music library. A REX Technologies product." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100f0c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f2e9" />
    <!-- before the first paint, so a chosen theme never flashes the other one. Same key as state/prefs.ts -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('selecta.prefs') || '{}').theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          // Match the selected palette in supported browser/PWA chrome before first paint.
          var chrome = theme === 'light' ? '#f5f2e9' : '#100f0c';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = chrome;
          });
        }
      } catch (error) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/png/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/png/favicon-32.png" />
    <!-- Link previews (web/public/brand/BRAND.md): absolute, because previews are fetched by other sites -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SelectaDJ" />
    <meta property="og:title" content="SelectaDJ" />
    <meta property="og:description" content="Make and play mixes from your own music. A REX Technologies product." />
    <meta property="og:image" content="https://app.selectadj.app/brand/png/social-card-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SelectaDJ: make and play mixes from your own music" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SelectaDJ" />
    <meta name="twitter:description" content="Make and play mixes from your own music." />
    <meta name="twitter:image" content="https://app.selectadj.app/brand/png/social-card-1200x630.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8ff3a'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23100f0c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- First paint is never blank (ADR-0477): the same waiting gate the Cloud runtime shows, drawn by
         the stylesheets alone (boot.css .gate-loading, feel-parts.css .boot-splash), which also stop
         its movement under reduced motion. React replaces it on its first render. No script and no
         style block, so the security headers' hashes are untouched. -->
    <div id="root"><div class="gate gate-loading boot-splash" aria-busy="true"><div class="gate-wait"><span class="brand-mark-badge gate-pulse" aria-hidden="true">S</span><span class="gate-line" aria-hidden="true"><i></i></span><p class="visually-hidden">Starting SelectaDJ</p></div></div></div>
    <noscript><p style="max-width:32rem;margin:15vh auto;padding:0 16px;font:16px/1.5 system-ui,sans-serif">SelectaDJ needs JavaScript to make and play mixes. Turn it on for this site, or open SelectaDJ in another browser. Help: support@selectadj.app</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
