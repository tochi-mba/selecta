[project]
name = "selecta"
version = "0.1.0"
description = "An auto DJ that searches your whole library for connections no person could hold in their head."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "alembic>=1.13",
    "anthropic>=2.8.0",
    "beat-this>=1.1",
    "demucs>=4.0.1",
    "fastapi>=0.162.4",
    "httpx>=0.27",
    "librosa>=1.0",
    "mutagen>=1.48",
    "nnaudio>=0.3.4",
    "numpy>=2.1",
    "pedalboard>=0.9.26",
    "psutil>=6",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "pyloudnorm>=0.2.0",
    "rich>=13",
    "scipy>=1.14",
    "soundfile>=0.13",
    "sqlalchemy>=2.0",
    "torch>=2.7",
    "torchaudio>=2.7",
    "typer>=0.29.0",
    "uvicorn>=0.30",
    "weftai==0.7.0",
    "weftai-providers==0.7.0",
]

[project.optional-dependencies]
# Cloud services export OpenTelemetry traces and Sentry errors only with this extra (ADR-0410).
# The code itself needs only opentelemetry-api, which FastAPI and Anthropic already require.
observability = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    # Error reports to Sentry, only when SELECTA_SENTRY_DSN is set (observability/errors.py).
    "sentry-sdk>=2.20",
]

[project.scripts]
selecta = "selecta.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "opentelemetry-sdk>=1.45",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selecta"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/selecta/cli.py" = ["B008"]
"src/selecta/api_cloud.py" = ["B008"]
"src/selecta/billing/api.py" = ["B008"]
"src/selecta/storage/api.py" = ["B008"]
"src/selecta/planner/reel.py" = ["E501"]
"src/selecta/planner/gridcheck.py" = ["E501"]
"tests/test_gp_0260_handoff.py" = ["F811"]
"tests/test_s2_mix_presets.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
