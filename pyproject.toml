[project]
name = "selecta"
version = "0.1.0"
description = "An auto DJ that searches your whole library for connections no person could hold in their head."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "beat-this>=1.1",
    "demucs>=4.0.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "librosa>=1.0",
    "mutagen>=1.48",
    "nnaudio>=0.3.4",
    "numpy>=2.1",
    "pedalboard>=0.9.26",
    "psutil>=6",
    "pyloudnorm>=0.2.0",
    "rich>=13",
    "scipy>=1.14",
    "soundfile>=0.13",
    "torch>=2.7",
    "torchaudio>=2.7",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
selecta = "selecta.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selecta"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/selecta/cli.py" = ["B008"]
"src/selecta/planner/reel.py" = ["E501"]
"src/selecta/planner/gridcheck.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
