# Render Blueprint for Selecta Cloud (ADR-0409). One project, two environments.
# Frankfurt only. API, gateway and maintenance run here; workers never do (see infra/modal/).
# Secrets are service-level `sync: false` entries: Render prompts for them during initial setup.
# Images come from GHCR, built on `main` by .github/workflows/deploy.yml; a deploy sets the tag.
# Checked by tests/test_cloud_infra.py.
projects:
  - name: selecta-cloud
    environments:
      - name: staging
        permissions:
          protection: disabled
        services:
          - type: web
            name: selecta-api-staging
            runtime: image
            image: &image
              url: ghcr.io/tochi-mba/selecta-service:main
              creds:
                fromRegistryCreds:
                  name: ghcr
            region: frankfurt
            plan: starter
            numInstances: 1
            healthCheckPath: /api/ready
            dockerCommand: selecta web --no-open --port 10000
            envVars:
              - &api_mode
                key: SELECTA_MODE
                value: cloud
              - &allowed_hosts
                key: SELECTA_ALLOWED_HOSTS
                sync: false
              - &allowed_origins
                key: SELECTA_ALLOWED_ORIGINS
                sync: false
              - &auth_issuer
                key: SELECTA_AUTH_ISSUER
                sync: false
              - &auth_audience
                key: SELECTA_AUTH_AUDIENCE
                sync: false
              - &workos_api_key
                key: SELECTA_WORKOS_API_KEY
                sync: false
              - &workos_client_id
                key: SELECTA_WORKOS_CLIENT_ID
                sync: false
              - &workos_webhook_secret
                key: SELECTA_WORKOS_WEBHOOK_SECRET
                sync: false
              - &stripe_secret_key
                key: SELECTA_STRIPE_SECRET_KEY
                sync: false
              - &stripe_webhook_secrets
                key: SELECTA_STRIPE_WEBHOOK_SECRETS
                sync: false
              - &stripe_prices
                key: SELECTA_STRIPE_PRICES
                sync: false
              - &r2_account_id
                key: SELECTA_R2_ACCOUNT_ID
                sync: false
              - &r2_access_key_id
                key: SELECTA_R2_ACCESS_KEY_ID
                sync: false
              - &r2_secret_access_key
                key: SELECTA_R2_SECRET_ACCESS_KEY
                sync: false
              - &r2_jurisdiction
                key: SELECTA_R2_JURISDICTION
                value: eu
              - &ip_hash_key
                key: SELECTA_IP_HASH_KEY
                sync: false
              - &rooms_pepper
                key: SELECTA_ROOMS_PEPPER
                sync: false
              - &checkout_consent_version
                key: SELECTA_CHECKOUT_CONSENT_VERSION
                sync: false
              - &staff_organization_id
                key: SELECTA_STAFF_ORGANIZATION_ID
                sync: false
              - &anthropic_api_key
                key: ANTHROPIC_API_KEY
                sync: false
              - &client_ip_header
                key: SELECTA_CLIENT_IP_HEADER
                value: cf-connecting-ip
              - &otel_endpoint
                key: OTEL_EXPORTER_OTLP_ENDPOINT
                sync: false
              - &otel_headers
                key: OTEL_EXPORTER_OTLP_HEADERS
                sync: false
              - key: SELECTA_ENV
                value: staging
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-staging-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-staging-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-staging-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-staging-staging
              - key: SELECTA_DATABASE_URL
                fromDatabase:
                  name: selecta-db-staging
                  property: connectionString
          - type: web
            name: selecta-gateway-staging
            runtime: image
            image: *image
            region: frankfurt
            plan: starter
            numInstances: 1
            healthCheckPath: /api/ready
            dockerCommand: selecta gateway --port 10000
            envVars:
              - *api_mode
              - &gateway_allowed_hosts
                key: SELECTA_GATEWAY_ALLOWED_HOSTS
                sync: false
              - &worker_token_secret
                key: SELECTA_WORKER_TOKEN_SECRET
                sync: false
              - &worker_bootstrap_token
                key: SELECTA_WORKER_BOOTSTRAP_TOKEN
                sync: false
              - *r2_account_id
              - *r2_access_key_id
              - *r2_secret_access_key
              - *r2_jurisdiction
              - *otel_endpoint
              - *otel_headers
              - key: SELECTA_ENV
                value: staging
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-staging-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-staging-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-staging-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-staging-staging
              - key: SELECTA_GATEWAY_DATABASE_URL
                fromDatabase:
                  name: selecta-db-staging
                  property: connectionString
          - type: worker
            name: selecta-maintain-staging
            runtime: image
            image: *image
            region: frankfurt
            plan: starter
            numInstances: 2
            dockerCommand: selecta maintain
            envVars:
              - *api_mode
              - *workos_api_key
              - *stripe_secret_key
              - *stripe_prices
              - *r2_account_id
              - *r2_access_key_id
              - *r2_secret_access_key
              - *r2_jurisdiction
              - *rooms_pepper
              - &backup_s3_endpoint
                key: SELECTA_BACKUP_S3_ENDPOINT
                sync: false
              - &backup_access_key_id
                key: SELECTA_BACKUP_ACCESS_KEY_ID
                sync: false
              - &backup_secret_access_key
                key: SELECTA_BACKUP_SECRET_ACCESS_KEY
                sync: false
              - &modal_token_id
                key: SELECTA_MODAL_TOKEN_ID
                sync: false
              - &modal_token_secret
                key: SELECTA_MODAL_TOKEN_SECRET
                sync: false
              - &dmca_agent_registered_on
                key: SELECTA_DMCA_AGENT_REGISTERED_ON
                sync: false
              - *otel_endpoint
              - *otel_headers
              - key: SELECTA_ENV
                value: staging
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-staging-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-staging-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-staging-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-staging-staging
              - key: SELECTA_R2_BUCKET_DELETION_LEDGER
                value: selecta-staging-deletion-ledger
              - key: SELECTA_BACKUP_BUCKET
                value: selecta-staging-db-dumps
              - key: SELECTA_MODAL_APP
                value: selecta-workers-staging
              - key: SELECTA_MAINTENANCE_DATABASE_URL
                fromDatabase:
                  name: selecta-db-staging
                  property: connectionString
        databases:
          - name: selecta-db-staging
            region: frankfurt
            plan: basic-1gb
            postgresMajorVersion: "17"
            ipAllowList: []
      - name: production
        permissions:
          protection: enabled
        services:
          - type: web
            name: selecta-api-production
            runtime: image
            image: *image
            region: frankfurt
            plan: standard
            scaling:
              minInstances: 2
              maxInstances: 6
              targetCPUPercent: 70
            healthCheckPath: /api/ready
            dockerCommand: selecta web --no-open --port 10000
            envVars:
              - *api_mode
              - *allowed_hosts
              - *allowed_origins
              - *auth_issuer
              - *auth_audience
              - *workos_api_key
              - *workos_client_id
              - *workos_webhook_secret
              - *stripe_secret_key
              - *stripe_webhook_secrets
              - *stripe_prices
              - *r2_account_id
              - *r2_access_key_id
              - *r2_secret_access_key
              - *r2_jurisdiction
              - *ip_hash_key
              - *rooms_pepper
              - *checkout_consent_version
              - *staff_organization_id
              - *anthropic_api_key
              - *client_ip_header
              - *otel_endpoint
              - *otel_headers
              - key: SELECTA_ENV
                value: production
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-production-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-production-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-production-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-production-staging
              - key: SELECTA_DATABASE_URL
                fromDatabase:
                  name: selecta-db-production
                  property: connectionString
          - type: web
            name: selecta-gateway-production
            runtime: image
            image: *image
            region: frankfurt
            plan: standard
            numInstances: 2
            healthCheckPath: /api/ready
            dockerCommand: selecta gateway --port 10000
            envVars:
              - *api_mode
              - *gateway_allowed_hosts
              - *worker_token_secret
              - *worker_bootstrap_token
              - *r2_account_id
              - *r2_access_key_id
              - *r2_secret_access_key
              - *r2_jurisdiction
              - *otel_endpoint
              - *otel_headers
              - key: SELECTA_ENV
                value: production
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-production-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-production-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-production-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-production-staging
              - key: SELECTA_GATEWAY_DATABASE_URL
                fromDatabase:
                  name: selecta-db-production
                  property: connectionString
          - type: worker
            name: selecta-maintain-production
            runtime: image
            image: *image
            region: frankfurt
            plan: starter
            numInstances: 2
            dockerCommand: selecta maintain
            envVars:
              - *api_mode
              - *workos_api_key
              - *stripe_secret_key
              - *stripe_prices
              - *r2_account_id
              - *r2_access_key_id
              - *r2_secret_access_key
              - *r2_jurisdiction
              - *rooms_pepper
              - *backup_s3_endpoint
              - *backup_access_key_id
              - *backup_secret_access_key
              - *modal_token_id
              - *modal_token_secret
              - *dmca_agent_registered_on
              - *otel_endpoint
              - *otel_headers
              - key: SELECTA_ENV
                value: production
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-production-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-production-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-production-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-production-staging
              - key: SELECTA_R2_BUCKET_DELETION_LEDGER
                value: selecta-production-deletion-ledger
              - key: SELECTA_BACKUP_BUCKET
                value: selecta-production-db-dumps
              - key: SELECTA_MODAL_APP
                value: selecta-workers-production
              - key: SELECTA_MAINTENANCE_DATABASE_URL
                fromDatabase:
                  name: selecta-db-production
                  property: connectionString
        databases:
          - name: selecta-db-production
            region: frankfurt
            plan: pro-4gb
            postgresMajorVersion: "17"
            highAvailability:
              enabled: true
            ipAllowList: []
