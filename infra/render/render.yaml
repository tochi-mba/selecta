# Render Blueprint for Selecta Cloud (ADR-0409). One project, two environments.
# Frankfurt only. API, gateway and maintenance run here; workers never do (see infra/modal/).
# Secrets are `sync: false`: they are typed into Render once per environment, never committed.
# Images come from GHCR, built on `main` by .github/workflows/deploy.yml; a deploy sets the tag.
# Checked by tests/test_cloud_infra.py.
projects:
  - name: selecta-cloud
    environments:
      - name: staging
        protectedEnvironment: false
        services:
          - type: web
            name: selecta-api-staging
            runtime: image
            image: &image
              url: ghcr.io/tochi-mba/selecta-service:main
              creds:
                fromRegistryCreds:
                  name: ghcr
            region: frankfurt
            plan: starter
            numInstances: 1
            healthCheckPath: /api/ready
            dockerCommand: selecta web --no-open --port 10000
            envVars:
              - fromGroup: selecta-staging-api
              - key: SELECTA_ENV
                value: staging
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-staging-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-staging-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-staging-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-staging-staging
              - key: SELECTA_DATABASE_URL
                fromDatabase:
                  name: selecta-db-staging
                  property: connectionString
          - type: web
            name: selecta-gateway-staging
            runtime: image
            image: *image
            region: frankfurt
            plan: starter
            numInstances: 1
            healthCheckPath: /api/ready
            dockerCommand: selecta gateway --port 10000
            envVars:
              - fromGroup: selecta-staging-gateway
              - key: SELECTA_ENV
                value: staging
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-staging-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-staging-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-staging-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-staging-staging
              - key: SELECTA_GATEWAY_DATABASE_URL
                fromDatabase:
                  name: selecta-db-staging
                  property: connectionString
          - type: worker
            name: selecta-maintain-staging
            runtime: image
            image: *image
            region: frankfurt
            plan: starter
            numInstances: 2
            dockerCommand: selecta maintain
            envVars:
              - fromGroup: selecta-staging-maintenance
              - key: SELECTA_ENV
                value: staging
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-staging-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-staging-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-staging-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-staging-staging
              - key: SELECTA_R2_BUCKET_DELETION_LEDGER
                value: selecta-staging-deletion-ledger
              - key: SELECTA_BACKUP_BUCKET
                value: selecta-staging-db-dumps
              - key: SELECTA_MODAL_APP
                value: selecta-workers-staging
              - key: SELECTA_MAINTENANCE_DATABASE_URL
                fromDatabase:
                  name: selecta-db-staging
                  property: connectionString
        databases:
          - name: selecta-db-staging
            region: frankfurt
            plan: basic-1gb
            postgresMajorVersion: "17"
            ipAllowList: []
      - name: production
        protectedEnvironment: true
        services:
          - type: web
            name: selecta-api-production
            runtime: image
            image: *image
            region: frankfurt
            plan: standard
            scaling:
              minInstances: 2
              maxInstances: 6
              targetCPUPercent: 70
            healthCheckPath: /api/ready
            dockerCommand: selecta web --no-open --port 10000
            envVars:
              - fromGroup: selecta-production-api
              - key: SELECTA_ENV
                value: production
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-production-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-production-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-production-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-production-staging
              - key: SELECTA_DATABASE_URL
                fromDatabase:
                  name: selecta-db-production
                  property: connectionString
          - type: web
            name: selecta-gateway-production
            runtime: image
            image: *image
            region: frankfurt
            plan: standard
            numInstances: 2
            healthCheckPath: /api/ready
            dockerCommand: selecta gateway --port 10000
            envVars:
              - fromGroup: selecta-production-gateway
              - key: SELECTA_ENV
                value: production
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-production-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-production-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-production-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-production-staging
              - key: SELECTA_GATEWAY_DATABASE_URL
                fromDatabase:
                  name: selecta-db-production
                  property: connectionString
          - type: worker
            name: selecta-maintain-production
            runtime: image
            image: *image
            region: frankfurt
            plan: starter
            numInstances: 2
            dockerCommand: selecta maintain
            envVars:
              - fromGroup: selecta-production-maintenance
              - key: SELECTA_ENV
                value: production
              - key: SELECTA_R2_BUCKET_ORIGINALS
                value: selecta-production-originals
              - key: SELECTA_R2_BUCKET_DERIVED
                value: selecta-production-derived
              - key: SELECTA_R2_BUCKET_EXPORTS
                value: selecta-production-exports
              - key: SELECTA_R2_BUCKET_STAGING
                value: selecta-production-staging
              - key: SELECTA_R2_BUCKET_DELETION_LEDGER
                value: selecta-production-deletion-ledger
              - key: SELECTA_BACKUP_BUCKET
                value: selecta-production-db-dumps
              - key: SELECTA_MODAL_APP
                value: selecta-workers-production
              - key: SELECTA_MAINTENANCE_DATABASE_URL
                fromDatabase:
                  name: selecta-db-production
                  property: connectionString
        databases:
          - name: selecta-db-production
            region: frankfurt
            plan: pro-4gb
            postgresMajorVersion: "17"
            highAvailability:
              enabled: true
            ipAllowList: []

# Secret groups: every secret value is entered in the Render dashboard (sync: false).
envVarGroups:
  - name: selecta-staging-api
    envVars: &api_vars
      - key: SELECTA_MODE
        value: cloud
      - key: SELECTA_ALLOWED_HOSTS
        sync: false
      - key: SELECTA_ALLOWED_ORIGINS
        sync: false
      - key: SELECTA_AUTH_ISSUER
        sync: false
      - key: SELECTA_AUTH_AUDIENCE
        sync: false
      - key: SELECTA_WORKOS_API_KEY
        sync: false
      - key: SELECTA_WORKOS_CLIENT_ID
        sync: false
      - key: SELECTA_WORKOS_WEBHOOK_SECRET
        sync: false
      - key: SELECTA_STRIPE_SECRET_KEY
        sync: false
      - key: SELECTA_STRIPE_WEBHOOK_SECRETS
        sync: false
      - key: SELECTA_STRIPE_PRICES
        sync: false
      - key: SELECTA_R2_ACCOUNT_ID
        sync: false
      - key: SELECTA_R2_ACCESS_KEY_ID
        sync: false
      - key: SELECTA_R2_SECRET_ACCESS_KEY
        sync: false
      - key: SELECTA_R2_JURISDICTION
        value: eu
      - key: SELECTA_IP_HASH_KEY
        sync: false
      - key: SELECTA_ROOMS_PEPPER
        sync: false
      - key: SELECTA_CHECKOUT_CONSENT_VERSION
        sync: false
      # The WorkOS organization whose members may open the staff console.
      - key: SELECTA_STAFF_ORGANIZATION_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # The visitor's address for Rooms' per-IP limits and code-guessing lockouts. Without it
      # every guest shares Render's proxy address, so one guesser locks every party out.
      - key: SELECTA_CLIENT_IP_HEADER
        value: cf-connecting-ip
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
  - name: selecta-production-api
    envVars: *api_vars
  - name: selecta-staging-gateway
    envVars: &gateway_vars
      - key: SELECTA_MODE
        value: cloud
      - key: SELECTA_GATEWAY_ALLOWED_HOSTS
        sync: false
      - key: SELECTA_WORKER_TOKEN_SECRET
        sync: false
      - key: SELECTA_WORKER_BOOTSTRAP_TOKEN
        sync: false
      - key: SELECTA_R2_ACCOUNT_ID
        sync: false
      - key: SELECTA_R2_ACCESS_KEY_ID
        sync: false
      - key: SELECTA_R2_SECRET_ACCESS_KEY
        sync: false
      - key: SELECTA_R2_JURISDICTION
        value: eu
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
  - name: selecta-production-gateway
    envVars: *gateway_vars
  - name: selecta-staging-maintenance
    envVars: &maintenance_vars
      - key: SELECTA_MODE
        value: cloud
      - key: SELECTA_WORKOS_API_KEY
        sync: false
      - key: SELECTA_STRIPE_SECRET_KEY
        sync: false
      - key: SELECTA_STRIPE_PRICES
        sync: false
      - key: SELECTA_R2_ACCOUNT_ID
        sync: false
      - key: SELECTA_R2_ACCESS_KEY_ID
        sync: false
      - key: SELECTA_R2_SECRET_ACCESS_KEY
        sync: false
      - key: SELECTA_R2_JURISDICTION
        value: eu
      - key: SELECTA_ROOMS_PEPPER
        sync: false
      # Backup freshness: a read-only key for the backup account's database-dump bucket.
      - key: SELECTA_BACKUP_S3_ENDPOINT
        sync: false
      - key: SELECTA_BACKUP_ACCESS_KEY_ID
        sync: false
      - key: SELECTA_BACKUP_SECRET_ACCESS_KEY
        sync: false
      # The autoscale leader scales the Modal app named on each maintenance service.
      - key: SELECTA_MODAL_TOKEN_ID
        sync: false
      - key: SELECTA_MODAL_TOKEN_SECRET
        sync: false
      # ISO date of the last DMCA designated-agent registration or renewal.
      - key: SELECTA_DMCA_AGENT_REGISTERED_ON
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
  - name: selecta-production-maintenance
    envVars: *maintenance_vars
