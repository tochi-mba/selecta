- name: selecta-phone
  rules:
  - alert: SelectaApiDown
    expr: sum(up{job="selecta-api"}) == 0 or absent(up{job="selecta-api"})
    for: 2m
    labels:
      severity: page
    annotations:
      summary: No API instance is answering.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/api-down.md
  - alert: SelectaOldestInteractiveJobOld
    expr: max(selecta_oldest_queued_seconds{lane="interactive"}) > 120
    for: 2m
    labels:
      severity: page
    annotations:
      summary: The oldest interactive job has waited more than 2 minutes.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/oldest-interactive-job.md
  - alert: SelectaJobsQuarantined
    expr: sum(increase(selecta_jobs_quarantined_total[15m])) > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: Jobs were quarantined.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/jobs-quarantined.md
  - alert: SelectaSpendCeilingHit
    expr: sum by (ceiling) (increase(selecta_spend_ceiling_hits_total[10m])) > 0
    for: 0m
    labels:
      severity: page
    annotations:
      summary: An AI or compute spend ceiling refused work.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/spend-ceiling.md
  - alert: SelectaAuditWritesStopped
    expr: sum(rate(selecta_audit_writes_total[15m])) == 0 and sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name=~"POST .*"}[15m])) > 0
    for: 15m
    labels:
      severity: page
    annotations:
      summary: Mutations are happening but no audit rows are being written.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/audit-writes-stopped.md
  - alert: SelectaReconciliationDrift
    expr: max by (check) (selecta_reconciliation_drift) > 0
    for: 30m
    labels:
      severity: ticket
    annotations:
      summary: Usage, storage or billing reconciliation found a difference.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/reconciliation-drift.md
  - alert: SelectaBackupFailed
    expr: time() - max(selecta_backup_last_success_timestamp_seconds) > 26 * 3600
    for: 0m
    labels:
      severity: page
    annotations:
      summary: No successful nightly backup in 26 hours.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/backup-failed.md
  - alert: SelectaMaintenanceLeaderMissing
    expr: time() - max(selecta_maintenance_leader_renewed_timestamp_seconds) > 60
    for: 2m
    labels:
      severity: page
    annotations:
      summary: No maintenance copy holds the leader term.
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/maintenance-service-down.md
