# Generated by selecta.observability.slo_rules. Edit slos.yaml or alerts.yaml.
groups:
- name: selecta-slo-recording
  interval: 1m
  rules:
  - record: selecta:slo_error_ratio:1h
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER", status_code!="STATUS_CODE_ERROR"}[1h]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER"}[1h]))))
    labels:
      slo: api_availability
  - record: selecta:slo_error_ratio:6h
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER", status_code!="STATUS_CODE_ERROR"}[6h]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER"}[6h]))))
    labels:
      slo: api_availability
  - record: selecta:slo_error_ratio:5m
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER", status_code!="STATUS_CODE_ERROR"}[5m]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER"}[5m]))))
    labels:
      slo: api_availability
  - record: selecta:slo_error_ratio:30m
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER", status_code!="STATUS_CODE_ERROR"}[30m]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_kind="SPAN_KIND_SERVER"}[30m]))))
    labels:
      slo: api_availability
  - record: selecta:slo_error_ratio:1h
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*", le="0.3"}[1h]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*"}[1h]))))
    labels:
      slo: api_routine_latency
  - record: selecta:slo_error_ratio:6h
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*", le="0.3"}[6h]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*"}[6h]))))
    labels:
      slo: api_routine_latency
  - record: selecta:slo_error_ratio:5m
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*", le="0.3"}[5m]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*"}[5m]))))
    labels:
      slo: api_routine_latency
  - record: selecta:slo_error_ratio:30m
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*", le="0.3"}[30m]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-api", span_kind="SPAN_KIND_SERVER", span_name!~".*(/events|/uploads|/lucy).*"}[30m]))))
    labels:
      slo: api_routine_latency
  - record: selecta:slo_error_ratio:1h
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive", le="10"}[1h]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive"}[1h]))))
    labels:
      slo: seam_start_latency
  - record: selecta:slo_error_ratio:6h
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive", le="10"}[6h]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive"}[6h]))))
    labels:
      slo: seam_start_latency
  - record: selecta:slo_error_ratio:5m
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive", le="10"}[5m]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive"}[5m]))))
    labels:
      slo: seam_start_latency
  - record: selecta:slo_error_ratio:30m
    expr: 1 - ((sum(rate(traces_spanmetrics_latency_bucket{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive", le="10"}[30m]))) / (sum(rate(traces_spanmetrics_latency_count{service="selecta-gateway", span_name="job.wait", selecta_lane="interactive"}[30m]))))
    labels:
      slo: seam_start_latency
  - record: selecta:slo_error_ratio:1h
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[1h])) - sum(rate(selecta_invariant_violations_total{invariant="accepted_job_lost"}[1h]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[1h]))))
    labels:
      slo: accepted_jobs_kept
  - record: selecta:slo_error_ratio:6h
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[6h])) - sum(rate(selecta_invariant_violations_total{invariant="accepted_job_lost"}[6h]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[6h]))))
    labels:
      slo: accepted_jobs_kept
  - record: selecta:slo_error_ratio:5m
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[5m])) - sum(rate(selecta_invariant_violations_total{invariant="accepted_job_lost"}[5m]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[5m]))))
    labels:
      slo: accepted_jobs_kept
  - record: selecta:slo_error_ratio:30m
    expr: 1 - ((sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[30m])) - sum(rate(selecta_invariant_violations_total{invariant="accepted_job_lost"}[30m]))) / (sum(rate(traces_spanmetrics_calls_total{service="selecta-api", span_name="job.enqueue"}[30m]))))
    labels:
      slo: accepted_jobs_kept
  - record: selecta:slo_error_ratio:1h
    expr: 1 - ((sum(rate(selecta_webhook_to_entitlement_seconds_bucket{le="60"}[1h]))) / (sum(rate(selecta_webhook_to_entitlement_seconds_count[1h]))))
    labels:
      slo: webhook_entitlement_latency
  - record: selecta:slo_error_ratio:6h
    expr: 1 - ((sum(rate(selecta_webhook_to_entitlement_seconds_bucket{le="60"}[6h]))) / (sum(rate(selecta_webhook_to_entitlement_seconds_count[6h]))))
    labels:
      slo: webhook_entitlement_latency
  - record: selecta:slo_error_ratio:5m
    expr: 1 - ((sum(rate(selecta_webhook_to_entitlement_seconds_bucket{le="60"}[5m]))) / (sum(rate(selecta_webhook_to_entitlement_seconds_count[5m]))))
    labels:
      slo: webhook_entitlement_latency
  - record: selecta:slo_error_ratio:30m
    expr: 1 - ((sum(rate(selecta_webhook_to_entitlement_seconds_bucket{le="60"}[30m]))) / (sum(rate(selecta_webhook_to_entitlement_seconds_count[30m]))))
    labels:
      slo: webhook_entitlement_latency
- name: selecta-slo-burn
  rules:
  - alert: SelectaSloBurn_api_availability_page
    expr: selecta:slo_error_ratio:1h{slo="api_availability"} > 0.072 and selecta:slo_error_ratio:5m{slo="api_availability"} > 0.072
    for: 2m
    labels:
      severity: page
      slo: api_availability
    annotations:
      summary: 'API availability: error budget burning 14.4x too fast'
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/slo-api-availability.md
      dashboard: selecta-slo-api_availability
  - alert: SelectaSloBurn_api_availability_ticket
    expr: selecta:slo_error_ratio:6h{slo="api_availability"} > 0.03 and selecta:slo_error_ratio:30m{slo="api_availability"} > 0.03
    for: 15m
    labels:
      severity: ticket
      slo: api_availability
    annotations:
      summary: 'API availability: error budget burning 6.0x too fast'
      runbook_url: https://github.com/tochi-mba/selecta/blob/main/docs/operations/slo-api-availability.md
      dashboard: selecta-slo-api_availability
  - alert: SelectaSloBurn_api_routine_latency_page
    expr: selecta:slo_error_ratio:1h{slo="api_routine_latency"} > 0.72 and selecta:slo_error_ratio:5m{slo="api_routine_latency"} > 0.72
    for: 2m
    labels:
      severity: page
